<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Force Pad 3D Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 10px 0; font-size: 20px; color: #00ffcc; text-transform: uppercase; letter-spacing: 1px;}
        p { margin: 5px 0; font-size: 14px; color: #ccc; line-height: 1.5; }
        .highlight { color: #ffeb3b; font-weight: bold; }
        
        #pressure-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            background: rgba(10,10,10,0.9);
            padding: 15px 40px;
            border-radius: 50px;
            border: 3px solid #555;
            pointer-events: none;
            transition: all 0.1s;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }
    </style>
    <!-- Import Three.js dan OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h1>Kinetic Force Pad</h1>
        <p>Inovasi Konversi Tekanan Statis ke Frekuensi Dinamis.</p>
        <br>
        <p>🕹️ <span class="highlight">Instruksi Interaktif:</span></p>
        <p>1. <b>Klik Kiri dan Geser</b> untuk memutar sudut pandang.</p>
        <p>2. <b>KLIK DAN TAHAN (Hold)</b> bantalan karet (pad) di tengah.</p>
        <p>3. Perhatikan <b>Panel LED Dashboard</b> menyala sesuai kekuatan tekanan Anda.</p>
    </div>

    <div id="pressure-info">FORCE: 0%</div>

    <div id="canvas-container"></div>

    <script>
        // Setup Dasar Scene Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.FogExp2(0x111111, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 50); // Kamera sedikit lebih tinggi

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        const canvasContainer = document.getElementById('canvas-container');
        canvasContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        controls.minDistance = 20;
        controls.maxDistance = 80;

        // Pencahayaan
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const spotLight = new THREE.SpotLight(0x00ffcc, 0.4);
        spotLight.position.set(-20, 30, 10);
        spotLight.angle = Math.PI/4;
        scene.add(spotLight);

        // Lantai Meja
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x0a0a0a, 
            roughness: 0.2, 
            metalness: 0.8 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -5;
        floor.receiveShadow = true;
        scene.add(floor);

        // ==========================================
        // PEMBUATAN BODI ALAT (WEDGE / LANDAI)
        // ==========================================
        const deviceGroup = new THREE.Group();
        scene.add(deviceGroup);

        // Bodi Utama
        const baseGeo = new THREE.BoxGeometry(34, 4, 24);
        const baseMat = new THREE.MeshStandardMaterial({ 
            color: 0x222222, 
            roughness: 0.8,
            metalness: 0.3
        });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 2;
        base.rotation.x = Math.PI / 14; 
        base.castShadow = true;
        base.receiveShadow = true;
        deviceGroup.add(base);

        // Kaki penyangga bawah 
        const supportGeo = new THREE.BoxGeometry(32, 6, 12);
        const support = new THREE.Mesh(supportGeo, baseMat);
        support.position.set(0, -1, -6);
        support.castShadow = true;
        deviceGroup.add(support);

        // Aksen Garis Neon Bawah
        const accentGeo = new THREE.BoxGeometry(34.5, 0.3, 24.5);
        const accentMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc }); // Basic material biar nyala
        const accent = new THREE.Mesh(accentGeo, accentMat);
        accent.position.y = -1;
        base.add(accent);

        // ==========================================
        // BANTALAN KARET TEBAL (PRESSURE PADS)
        // ==========================================
        const pads = [];
        const padMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x151515, 
            roughness: 0.9, 
            metalness: 0.1
        });

        const cylinderGeo = new THREE.CylinderGeometry(5.5, 5.8, 3, 32);
        const domeGeo = new THREE.SphereGeometry(5.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 4);
        
        function createPad(xPosition) {
            const padGroup = new THREE.Group();
            
            const cylinder = new THREE.Mesh(cylinderGeo, padMaterial);
            cylinder.castShadow = true;
            cylinder.receiveShadow = true;
            
            const dome = new THREE.Mesh(domeGeo, padMaterial);
            dome.position.y = 1.5; 
            dome.scale.y = 0.3; 
            dome.castShadow = true;

            const ringGeo = new THREE.TorusGeometry(6, 0.2, 16, 32);
            // Ring highlight
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x333333 }); 
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = -1.2;
            ring.rotation.x = Math.PI/2;

            padGroup.add(cylinder);
            padGroup.add(dome);
            padGroup.add(ring);

            padGroup.position.set(xPosition, 3.5, 3);
            padGroup.userData = { isPad: true, originalY: 3.5, ring: ring };

            base.add(padGroup);
            pads.push(padGroup);
            
            return padGroup;
        }

        const leftPadGroup = createPad(-8.5);
        const rightPadGroup = createPad(8.5);

        // ==========================================
        // PANEL LED DASHBOARD (DIPERBESAR & DIPERJELAS)
        // ==========================================
        const leds = [];
        const panelGroup = new THREE.Group();
        // Posisikan panel di bagian belakang atas alat, dimiringkan agar menghadap mata pemain
        panelGroup.position.set(0, 3, -8);
        panelGroup.rotation.x = -Math.PI / 8;
        base.add(panelGroup);

        // Casing Panel Hitam
        const ledCaseGeo = new THREE.BoxGeometry(26, 4, 2);
        const ledCaseMat = new THREE.MeshStandardMaterial({color: 0x050505, roughness: 0.4});
        const ledCase = new THREE.Mesh(ledCaseGeo, ledCaseMat);
        ledCase.castShadow = true;
        panelGroup.add(ledCase);

        // Kaca Pelindung Panel (agak transparan dan mengkilap)
        const glassGeo = new THREE.BoxGeometry(25, 3, 0.2);
        const glassMat = new THREE.MeshStandardMaterial({
            color: 0x000000, 
            roughness: 0.1, 
            metalness: 0.9, 
            transparent: true, 
            opacity: 0.6
        });
        const glass = new THREE.Mesh(glassGeo, glassMat);
        glass.position.z = 1.05;
        panelGroup.add(glass);

        // Membangun Blok LED
        const totalLeds = 20; // Perbanyak jumlah LED agar lebih detail
        const ledWidth = 0.8;
        const ledSpacing = 1.1;
        const startX = -((totalLeds * ledSpacing) / 2) + (ledSpacing / 2);

        for(let i=0; i<totalLeds; i++) {
            const ledGeo = new THREE.BoxGeometry(ledWidth, 1.8, 0.5);
            // Gunakan MeshBasicMaterial untuk default agar tetap terlihat sedikit (tidak hitam pekat)
            const ledMat = new THREE.MeshBasicMaterial({ color: 0x2a2a2a });
            const led = new THREE.Mesh(ledGeo, ledMat);
            
            led.position.set(startX + (i * ledSpacing), 0, 0.8); // Taruh tepat di belakang kaca
            
            // Logika Warna Bergradasi (Kiri Hijau -> Tengah Kuning -> Kanan Merah)
            let colorHex;
            if(i < totalLeds * 0.5) {
                colorHex = 0x00ff44; // Hijau
            } else if (i < totalLeds * 0.8) {
                colorHex = 0xffea00; // Kuning
            } else {
                colorHex = 0xff1100; // Merah
            }
            
            led.userData = { 
                defaultColor: 0x2a2a2a, 
                activeColor: colorHex 
            };
            
            panelGroup.add(led);
            leds.push(led);
        }

        // ==========================================
        // LOGIKA INTERAKSI (RAYCASTER & MOUSE)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        let isPressing = false;
        let pressureValue = 0; 
        let activePad = null;
        const pressureUI = document.getElementById('pressure-info');

        function getPadGroup(object) {
            let curr = object;
            while(curr) {
                if (curr.userData && curr.userData.isPad) return curr;
                curr = curr.parent;
            }
            return null;
        }

        function startPress(event) {
            event.preventDefault();

            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pads, true);

            if (intersects.length > 0) {
                activePad = getPadGroup(intersects[0].object);
                if (activePad) {
                    isPressing = true;
                    // Ubah warna ring jadi nyala cyan saat ditekan
                    activePad.userData.ring.material.color.setHex(0x00ffcc);
                    controls.enabled = false; 
                }
            }
        }

        function endPress(event) {
            isPressing = false;
            if(activePad) {
                activePad.userData.ring.material.color.setHex(0x333333);
                activePad = null;
            }
            controls.enabled = true; 
        }

        function onMouseMove(event) {
            if (isPressing) return;
            
            let clientX = event.clientX;
            let clientY = event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pads, true);
            
            if (intersects.length > 0 && getPadGroup(intersects[0].object)) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }

        const canvasEl = renderer.domElement;
        canvasEl.addEventListener('pointerdown', startPress);
        canvasEl.addEventListener('pointermove', onMouseMove);
        window.addEventListener('pointerup', endPress);
        window.addEventListener('pointercancel', endPress);
        canvasEl.addEventListener('touchstart', startPress, {passive: false});
        window.addEventListener('touchend', endPress);

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // ANIMATION LOOP
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Update Nilai Tekanan
            if (isPressing) {
                pressureValue += 120 * delta; 
                if (pressureValue > 100) pressureValue = 100;
            } else {
                pressureValue -= 250 * delta;
                if (pressureValue < 0) pressureValue = 0;
            }

            // Update UI Teks
            pressureUI.innerText = `FORCE: ${Math.round(pressureValue)}%`;
            if(pressureValue > 80) {
                pressureUI.style.borderColor = '#ff1100';
                pressureUI.style.color = '#ff1100';
                pressureUI.style.boxShadow = '0 0 20px rgba(255, 17, 0, 0.6)';
            } else if (pressureValue > 50) {
                pressureUI.style.borderColor = '#ffea00';
                pressureUI.style.color = '#ffea00';
                pressureUI.style.boxShadow = '0 0 20px rgba(255, 234, 0, 0.4)';
            } else if (pressureValue > 0) {
                pressureUI.style.borderColor = '#00ffcc';
                pressureUI.style.color = '#00ffcc';
                pressureUI.style.boxShadow = '0 0 20px rgba(0, 255, 204, 0.3)';
            } else {
                pressureUI.style.borderColor = '#555';
                pressureUI.style.color = '#fff';
                pressureUI.style.boxShadow = '0 0 20px rgba(0,0,0,0.8)';
            }

            // Animasi Amblas Pad
            if (activePad) {
                activePad.position.y = activePad.userData.originalY - (pressureValue / 100) * 1.2;
            } else {
                leftPadGroup.position.y += (leftPadGroup.userData.originalY - leftPadGroup.position.y) * 0.3;
                rightPadGroup.position.y += (rightPadGroup.userData.originalY - rightPadGroup.position.y) * 0.3;
            }

            // Animasi LED Meter Dashboard (Menyala Terang)
            const activeLedCount = Math.floor((pressureValue / 100) * totalLeds);
            for(let i=0; i<totalLeds; i++) {
                if (i < activeLedCount) {
                    leds[i].material.color.setHex(leds[i].userData.activeColor);
                } else {
                    leds[i].material.color.setHex(leds[i].userData.defaultColor);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
