<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Force Pad 3D Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: auto; /* Diubah agar tombol bisa diklik */
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 10px 0; font-size: 20px; color: #00ffcc; text-transform: uppercase; letter-spacing: 1px;}
        p { margin: 5px 0; font-size: 14px; color: #ccc; line-height: 1.5; pointer-events: none;}
        .highlight { color: #ffeb3b; font-weight: bold; }
        
        /* Tambahan UI untuk Gear Selector */
        .gear-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #555;
        }
        .gear-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .gear-btn {
            background: #222;
            color: #fff;
            border: 2px solid #555;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            flex: 1;
        }
        .gear-btn:hover { background: #444; }
        .gear-btn.active {
            background: #00ffcc;
            color: #000;
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        #pressure-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            background: rgba(10,10,10,0.9);
            padding: 15px 40px;
            border-radius: 20px; /* Disesuaikan untuk 2 baris teks */
            border: 3px solid #555;
            pointer-events: none;
            transition: all 0.1s;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            text-align: center;
        }
        .output-text {
            font-size: 32px;
            color: #00ffcc;
            margin-top: 5px;
        }
    </style>
    <!-- Import Three.js dan OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h1>Kinetic Force Pad</h1>
        <p>Inovasi Konversi Tekanan Statis ke Frekuensi Dinamis.</p>
        <br>
        <p>🕹️ <span class="highlight">Instruksi Interaktif:</span></p>
        <p>1. <b>Klik & Tahan</b> bantalan karet di tengah.</p>
        <p>2. Perhatikan <b>Panel LED</b> menyala sesuai tekanan.</p>
        
        <div class="gear-panel">
            <p style="color: #fff; font-weight: bold; pointer-events: none;">⚙️ OUTPUT MULTIPLIER (Untuk PvE/Lego):</p>
            <div class="gear-buttons">
                <button class="gear-btn active" onclick="setGear(1, 15)" id="btn-gear1">Gear 1<br><small>15 Clicks/s</small></button>
                <button class="gear-btn" onclick="setGear(2, 30)" id="btn-gear2">Gear 2<br><small>30 Clicks/s</small></button>
                <button class="gear-btn" onclick="setGear(3, 60)" id="btn-gear3">Gear 3<br><small>60 Clicks/s</small></button>
            </div>
        </div>
    </div>

    <div id="pressure-info">
        <div id="text-force">FORCE: 0%</div>
        <div id="text-output" class="output-text">OUTPUT: 0 Clicks/sec</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // Logika Gear / Output Multiplier
        let maxClicksPerSecond = 15; // Default Gear 1

        function setGear(gearNum, maxCPS) {
            maxClicksPerSecond = maxCPS;
            
            // Update UI Button
            document.getElementById('btn-gear1').classList.remove('active');
            document.getElementById('btn-gear2').classList.remove('active');
            document.getElementById('btn-gear3').classList.remove('active');
            
            document.getElementById('btn-gear' + gearNum).classList.add('active');
        }

        const leftPadGroup = createPad(-8.5);
        const rightPadGroup = createPad(8.5);

        // ==========================================
        // PANEL LED DASHBOARD (DIPERBESAR & DIPERJELAS)
        // ==========================================
        const leds = [];
        const panelGroup = new THREE.Group();
        // Posisikan panel di bagian belakang atas alat, dimiringkan agar menghadap mata pemain
        panelGroup.position.set(0, 3, -8);
        panelGroup.rotation.x = -Math.PI / 8;
        base.add(panelGroup);

        // Casing Panel Hitam
        const ledCaseGeo = new THREE.BoxGeometry(26, 4, 2);
        const ledCaseMat = new THREE.MeshStandardMaterial({color: 0x050505, roughness: 0.4});
        const ledCase = new THREE.Mesh(ledCaseGeo, ledCaseMat);
        ledCase.castShadow = true;
        panelGroup.add(ledCase);

        // Kaca Pelindung Panel (agak transparan dan mengkilap)
        const glassGeo = new THREE.BoxGeometry(25, 3, 0.2);
        const glassMat = new THREE.MeshStandardMaterial({
            color: 0x000000, 
            roughness: 0.1, 
            metalness: 0.9, 
            transparent: true, 
            opacity: 0.6
        });
        const glass = new THREE.Mesh(glassGeo, glassMat);
        glass.position.z = 1.05;
        panelGroup.add(glass);

        // Membangun Blok LED
        const totalLeds = 20; // Perbanyak jumlah LED agar lebih detail
        const ledWidth = 0.8;
        const ledSpacing = 1.1;
        const startX = -((totalLeds * ledSpacing) / 2) + (ledSpacing / 2);

        for(let i=0; i<totalLeds; i++) {
            const ledGeo = new THREE.BoxGeometry(ledWidth, 1.8, 0.5);
            // Gunakan MeshBasicMaterial untuk default agar tetap terlihat sedikit (tidak hitam pekat)
            const ledMat = new THREE.MeshBasicMaterial({ color: 0x2a2a2a });
            const led = new THREE.Mesh(ledGeo, ledMat);
            
            led.position.set(startX + (i * ledSpacing), 0, 0.8); // Taruh tepat di belakang kaca
            
            // Logika Warna Bergradasi (Kiri Hijau -> Tengah Kuning -> Kanan Merah)
            let colorHex;
            if(i < totalLeds * 0.5) {
                colorHex = 0x00ff44; // Hijau
            } else if (i < totalLeds * 0.8) {
                colorHex = 0xffea00; // Kuning
            } else {
                colorHex = 0xff1100; // Merah
            }
            
            led.userData = { 
                defaultColor: 0x2a2a2a, 
                activeColor: colorHex 
            };
            
            panelGroup.add(led);
            leds.push(led);
        }

        // ==========================================
        // LOGIKA INTERAKSI (RAYCASTER & MOUSE)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        let isPressing = false;
        let pressureValue = 0; 
        let activePad = null;
        const pressureUI = document.getElementById('pressure-info');

        function getPadGroup(object) {
            let curr = object;
            while(curr) {
                if (curr.userData && curr.userData.isPad) return curr;
                curr = curr.parent;
            }
            return null;
        }

        function startPress(event) {
            event.preventDefault();

            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pads, true);

            if (intersects.length > 0) {
                activePad = getPadGroup(intersects[0].object);
                if (activePad) {
                    isPressing = true;
                    // Ubah warna ring jadi nyala cyan saat ditekan
                    activePad.userData.ring.material.color.setHex(0x00ffcc);
                    controls.enabled = false; 
                }
            }
        }

        function endPress(event) {
            isPressing = false;
            if(activePad) {
                activePad.userData.ring.material.color.setHex(0x333333);
                activePad = null;
            }
            controls.enabled = true; 
        }

        function onMouseMove(event) {
            if (isPressing) return;
            
            let clientX = event.clientX;
            let clientY = event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pads, true);
            
            if (intersects.length > 0 && getPadGroup(intersects[0].object)) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }

        const canvasEl = renderer.domElement;
        canvasEl.addEventListener('pointerdown', startPress);
        canvasEl.addEventListener('pointermove', onMouseMove);
        window.addEventListener('pointerup', endPress);
        window.addEventListener('pointercancel', endPress);
        canvasEl.addEventListener('touchstart', startPress, {passive: false});
        window.addEventListener('touchend', endPress);

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // ANIMATION LOOP
        // ==========================================
        const clock = new THREE.Clock();
        const forceText = document.getElementById('text-force');
        const outputText = document.getElementById('text-output');

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Update Nilai Tekanan
            if (isPressing) {
                pressureValue += 120 * delta; 
                if (pressureValue > 100) pressureValue = 100;
            } else {
                pressureValue -= 250 * delta;
                if (pressureValue < 0) pressureValue = 0;
            }

            // Kalkulasi Output Clicks Per Second (CPS) berdasarkan Gear
            const currentCPS = Math.round((pressureValue / 100) * maxClicksPerSecond);

            // Update UI Teks
            forceText.innerText = `USAHA (FORCE): ${Math.round(pressureValue)}%`;
            outputText.innerText = `OUTPUT: ${currentCPS} Clicks/sec`;

            if(pressureValue > 80) {
                pressureUI.style.borderColor = '#ff1100';
                outputText.style.color = '#ff1100';
                pressureUI.style.boxShadow = '0 0 20px rgba(255, 17, 0, 0.6)';
            } else if (pressureValue > 50) {
                pressureUI.style.borderColor = '#ffea00';
                outputText.style.color = '#ffea00';
                pressureUI.style.boxShadow = '0 0 20px rgba(255, 234, 0, 0.4)';
            } else if (pressureValue > 0) {
                pressureUI.style.borderColor = '#00ffcc';
                outputText.style.color = '#00ffcc';
                pressureUI.style.boxShadow = '0 0 20px rgba(0, 255, 204, 0.3)';
            } else {
                pressureUI.style.borderColor = '#555';
                outputText.style.color = '#fff';
                pressureUI.style.boxShadow = '0 0 20px rgba(0,0,0,0.8)';
            }

            // Animasi Amblas Pad
            if (activePad) {
                activePad.position.y = activePad.userData.originalY - (pressureValue / 100) * 1.2;
            } else {
                leftPadGroup.position.y += (leftPadGroup.userData.originalY - leftPadGroup.position.y) * 0.3;
                rightPadGroup.position.y += (rightPadGroup.userData.originalY - rightPadGroup.position.y) * 0.3;
            }

            // Animasi LED Meter Dashboard (Menyala Terang)
            const activeLedCount = Math.floor((pressureValue / 100) * totalLeds);
            for(let i=0; i<totalLeds; i++) {
                if (i < activeLedCount) {
                    leds[i].material.color.setHex(leds[i].userData.activeColor);
                } else {
                    leds[i].material.color.setHex(leds[i].userData.defaultColor);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
